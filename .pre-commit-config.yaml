repos:
  # Backend: ruff lint + format via uv (uses the same ruff version as backend deps)
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run --project backend ruff check --config backend/pyproject.toml --fix
        language: system
        types_or: [python]
        files: ^backend/
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format --config backend/pyproject.toml
        language: system
        types_or: [python]
        files: ^backend/

  # Frontend: eslint + prettier (must run from frontend/ for node_modules resolution)
  - repo: local
    hooks:
      - id: frontend-eslint
        name: eslint (frontend)
        entry: python scripts/precommit_frontend.py eslint
        language: system
        types_or: [javascript, tsx, ts]
        files: ^frontend/

      - id: frontend-prettier
        name: prettier (frontend)
        entry: python scripts/precommit_frontend.py prettier
        language: system
        files: ^frontend/
        types_or: [javascript, tsx, ts, json, css]
