# DeerFlow Hot Reload Development Environment
# Usage: docker-compose -f docker/docker-compose-hot-reload.yaml up -d
# Restart after code changes: docker-compose -f docker/docker-compose-hot-reload.yaml restart
#
# Features:
#   - Code hot reload via volume mounts (edit locally, container sees changes immediately)
#   - Flexible image source switching via environment variables
#
# Image Source Switching (set before running):
#   # Use domestic mirror
#   export APT_MIRROR=https://mirrors.aliyun.com/debian
#   export UV_IMAGE=registry.cn-beijing.aliyuncs.com/astral-sh/uv:0.7.20
#   export UV_INDEX_URL=https://mirrors.aliyun.com/pypi/simple
#   export NPM_REGISTRY=https://registry.npmmirror.com
#   export PNPM_STORE_PATH=/root/.local/share/pnpm/store
#
#   # Use official sources
#   export APT_MIRROR=
#   export UV_IMAGE=ghcr.io/astral-sh/uv:0.7.20
#   export UV_INDEX_URL=https://pypi.org/simple
#   export NPM_REGISTRY=
#
# Access: http://localhost:2026
# Frontend: http://localhost:3000
# Backend API: http://localhost:8001

services:
  # ── Reverse Proxy (skipped due to config compatibility issues) ───────────
  # nginx:
  #   image: quay.io/nginx/nginx-unprivileged:alpine
  #   container_name: deer-flow-nginx
  #   ports:
  #     - "2026:2026"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
  #   command:
  #     - sh
  #     - -c
  #     - |
  #       set -e
  #       cp /etc/nginx/nginx.conf.template /etc/nginx/nginx.conf
  #       test -e /proc/net/if_inet6 || sed -i '/^[[:space:]]*listen[[:space:]]\+\[::\]:2026;/d' /etc/nginx/nginx.conf
  #       exec nginx -g 'daemon off;'
  #   depends_on:
  #     - frontend
  #     - gateway
  #   networks:
  #     - deer-flow-hot
  #   restart: unless-stopped

  # ── Frontend: Next.js Development Server ─────────────────────────────────
  frontend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.frontend.hot
    container_name: deer-flow-frontend
    command: sh -c "cd frontend && pnpm run dev"
    volumes:
      - ../frontend/src:/app/frontend/src
      - ../frontend/public:/app/frontend/public
      - ../frontend/next.config.js:/app/frontend/next.config.js:ro
      - ../frontend/package.json:/app/frontend/package.json:ro
      - ../frontend/pnpm-lock.yaml:/app/frontend/pnpm-lock.yaml:ro
      - ../frontend/.env.local:/app/frontend/.env.local:ro
      - frontend-pnpm-cache:/root/.local/share/pnpm/store
    working_dir: /app
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CI=true
      - DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
    env_file:
      - ../frontend/.env
    ports:
      - "3000:3000"
    networks:
      - deer-flow-hot
    restart: unless-stopped

  # ── Backend: Gateway API with Hot Reload ─────────────────────────────────
  gateway:
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend.hot
    container_name: deer-flow-gateway
    command: >
      sh -c "
        cd backend &&
        (uv sync || (echo '[startup] uv sync failed, retrying...' && uv venv --allow-existing .venv && uv sync)) &&
        PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --reload --reload-include='*.yaml' --reload-include='*.json' --reload-include='.env'
      "
    volumes:
      - ../backend/:/app/backend/
      - backend-venv:/app/backend/.venv
      - ../config.yaml:/app/config.yaml:ro
      - ../extensions_config.json:/app/extensions_config.json:ro
      - ../skills:/app/skills:ro
      - ../.env:/app/.env:ro
      - backend-uv-cache:/root/.cache/uv
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME:?HOME must be set}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    working_dir: /app
    environment:
      - CI=true
      - DEER_FLOW_HOME=/app/backend/.deer-flow
      - DEER_FLOW_CONFIG_PATH=/app/config.yaml
      - DEER_FLOW_EXTENSIONS_CONFIG_PATH=/app/extensions_config.json
      - DEER_FLOW_CHANNELS_LANGGRAPH_URL=http://gateway:8001/api
      - DEER_FLOW_CHANNELS_GATEWAY_URL=http://gateway:8001
      - DEER_FLOW_HOST_BASE_DIR=/app/backend/.deer-flow
      - DEER_FLOW_HOST_SKILLS_PATH=/app/skills
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    networks:
      - deer-flow-hot
    restart: unless-stopped

volumes:
  backend-venv:
  backend-uv-cache:
  frontend-pnpm-cache:

networks:
  deer-flow-hot:
    driver: bridge