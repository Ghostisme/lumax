# DeerFlow Hot-Reload Environment
# Usage: docker compose -f docker-compose-hotreload.yaml up --build
#
# 特性:
#   - 代码目录完整挂载，修改后重启容器即可生效
#   - 前端/后端均使用 dev 模式，支持热更新
#   - 可通过环境变量自由切换镜像源
#   - 不包含 provisioner 服务（需 Kubernetes）
#
# Access: http://localhost:${PORT:-2026}
#
# 镜像源配置（在 .env 或环境中设置）:
#   APT_MIRROR=mirrors.aliyun.com        # Debian apt 镜像
#   NPM_REGISTRY=https://registry.npmmirror.com  # npm/pnpm 镜像
#   UV_IMAGE=ghcr.dockerproxy.com/astral-sh/uv:0.7.20  # uv 镜像
#   UV_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple  # PyPI 镜像
#   DOCKER_REGISTRY_MIRROR=https://docker.1ms.run  # Docker Hub 镜像

services:
  # ── Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: deer-flow-nginx-hr
    ports:
      - "${PORT:-2026}:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    command: ["nginx", "-g", "daemon off;"]
    entrypoint: []
    depends_on:
      - frontend
      - gateway
    networks:
      - deer-flow-hotreload
    restart: unless-stopped

  # ── Frontend: Next.js Dev Server ───────────────────────────────────────
  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: dev
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: deer-flow-frontend-hr
    command: sh -c "cd frontend && pnpm run dev"
    volumes:
      # 完整挂载项目根目录（软链接效果：代码更新只需重启）
      - ../:/app
      # 保留构建产物不被宿主机覆盖
      - frontend-node-modules:/app/frontend/node_modules
      - frontend-next-cache:/app/frontend/.next
    working_dir: /app
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - CI=true
      - DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
    env_file:
      - ../frontend/.env
    networks:
      - deer-flow-hotreload
    restart: unless-stopped

  # ── Gateway: FastAPI Dev Server ────────────────────────────────────────
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      target: dev
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        NODE_MIRROR: ${NODE_MIRROR:-https://mirrors.aliyun.com/nodesource/}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-http://mirrors.cloud.aliyuncs.com/pypi/simple}
        UV_EXTRAS: ${UV_EXTRAS:-}
    container_name: deer-flow-gateway-hr
    command: sh -c "cd backend && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --reload --reload-include '*.yaml,*.json,.env'"
    volumes:
      # 完整挂载项目根目录（软链接效果：代码更新只需重启）
      - ../:/app
      # 保留构建产物不被宿主机覆盖
      - gateway-venv:/app/backend/.venv
      - gateway-uv-cache:/root/.cache/uv
      - ${DEER_FLOW_HOME:-../backend/.deer-flow}:/app/backend/.deer-flow
      # DooD: Docker socket for sandbox management
      - ${DEER_FLOW_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      # CLI auth directories
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME:?HOME must be set}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    working_dir: /app
    environment:
      - CI=true
      - DEER_FLOW_HOME=/app/backend/.deer-flow
      - DEER_FLOW_CONFIG_PATH=/app/config.yaml
      - DEER_FLOW_EXTENSIONS_CONFIG_PATH=/app/extensions_config.json
      - DEER_FLOW_CHANNELS_LANGGRAPH_URL=${DEER_FLOW_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}
      - DEER_FLOW_CHANNELS_GATEWAY_URL=${DEER_FLOW_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      - DEER_FLOW_HOST_BASE_DIR=${DEER_FLOW_HOME:-/app/backend/.deer-flow}
      - DEER_FLOW_HOST_SKILLS_PATH=/app/skills
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow-hotreload
    restart: unless-stopped

volumes:
  # 前端依赖缓存
  frontend-node-modules:
  frontend-next-cache:
  # 后端依赖缓存
  gateway-venv:
  gateway-uv-cache:

networks:
  deer-flow-hotreload:
    driver: bridge
