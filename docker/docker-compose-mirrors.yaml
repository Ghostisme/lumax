# 镜像源覆盖配置 - 用于加速构建
# 通过 docker compose -f docker-compose-hotreload.yaml -f docker/docker-compose-mirrors.yaml 使用

services:
  frontend:
    build:
      args:
        NPM_REGISTRY: https://registry.npmmirror.com

  gateway:
    build:
      args:
        APT_MIRROR: mirrors.aliyun.com
        # UV 使用官方镜像，通过 Docker daemon 的 registry-mirrors 加速
        UV_IMAGE: ghcr.io/astral-sh/uv:0.7.20
        UV_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple

  nginx:
    image: nginx:alpine