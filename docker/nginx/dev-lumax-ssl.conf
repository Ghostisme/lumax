# Lumax Dev - HTTP 80 - 跳转 HTTPS + ACME challenge
server {
    listen 80;
    server_name dev.lumaxai.cn;

    # Certimate / ACME HTTP-01 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certimate;
    }

    return 301 https://$host$request_uri;
}

# Lumax Dev - HTTPS 443 - SSL 终止 + 反向代理到 Docker nginx
server {
    listen 443 ssl;
    server_name dev.lumaxai.cn;

    # SSL 证书: *.lumaxai.cn 通配符证书 (由 Certimate 自动管理)
    ssl_certificate     /etc/nginx/ssl/lumaxai.cn/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/lumaxai.cn/lumaxai.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 根路径直接跳到新建对话页，避免只依赖前端 middleware。
    location = / {
        return 307 /workspace/chats/new;
    }

    # API 请求代理到 Docker 内部 nginx
    location /api/ {
        proxy_pass http://127.0.0.1:2026/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE/Streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:2026/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其他所有请求代理到 Docker nginx (前端静态文件 + 其他路由)
    location / {
        proxy_pass http://127.0.0.1:2026;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
