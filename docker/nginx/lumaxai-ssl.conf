# Lumax Prod - HTTP 80 - 裸域跳转 www + HTTPS 跳转 + ACME challenge
server {
    listen 80;
    server_name lumaxai.cn www.lumaxai.cn;

    # Certimate / ACME HTTP-01 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certimate;
    }

    return 301 https://$host$request_uri;
}

# Lumax Prod - 裸域 lumaxai.cn 跳转到 www.lumaxai.cn
# (*.lumaxai.cn 通配符证书不覆盖裸域，因此这里用 HTTP 跳转)
server {
    listen 443 ssl;
    server_name lumaxai.cn;

    # 裸域需要单独证书，或直接跳转不提供 SSL
    # 这里使用与 www 相同的证书（如果证书包含裸域 SAN）
    # 如果通配符证书不含裸域，可删除此 server 块，仅靠 HTTP 跳转
    ssl_certificate     /etc/nginx/ssl/lumaxai.cn/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/lumaxai.cn/lumaxai.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://www.lumaxai.cn$request_uri;
}

# Lumax Prod - HTTPS 443 - SSL 终止 + 反向代理到 Docker nginx
server {
    listen 443 ssl;
    server_name www.lumaxai.cn;

    # SSL 证书: *.lumaxai.cn 通配符证书 (由 Certimate 自动管理)
    ssl_certificate     /etc/nginx/ssl/lumaxai.cn/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/lumaxai.cn/lumaxai.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 根路径直接跳到新建对话页，避免只依赖前端 middleware。
    location = / {
        return 307 /workspace/chats/new;
    }

    # API 请求代理到 Docker 内部 nginx
    location /api/ {
        proxy_pass http://127.0.0.1:2027/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE/Streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:2027/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其他所有请求代理到 Docker nginx (前端静态文件 + 其他路由)
    location / {
        proxy_pass http://127.0.0.1:2027;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
