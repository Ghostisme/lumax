# Lumax Prod - HTTP 80 - 反向代理到 Docker nginx
# 未来启用 HTTPS 时，替换为 lumaxai-ssl.conf
server {
    listen 80;
    server_name lumaxai.cn www.lumaxai.cn;

    # 根路径直接跳到新建对话页，避免只依赖前端 middleware。
    location = / {
        return 307 /workspace/chats/new;
    }

    # API 请求代理到 Docker 内部 nginx
    location /api/ {
        proxy_pass http://127.0.0.1:2027/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE/Streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:2027/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其他所有请求代理到 Docker nginx (前端静态文件 + 其他路由)
    location / {
        proxy_pass http://127.0.0.1:2027;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
